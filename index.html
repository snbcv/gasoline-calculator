<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ガソリン計算">
<meta name="theme-color" content="#34495e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ガソリン重量・容量 計算</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Yu Gothic UI', 'Hiragino Sans', 'Meiryo', sans-serif;
    background: #f0f2f5;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 16px;
    gap: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 28px 20px 24px;
    width: 100%;
    max-width: 480px;
  }
  h1 {
    text-align: center;
    font-size: 19px;
    color: #333;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  /* 比重セクション */
  .gravity-section {
    background: #e8f4fd;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .gravity-section label {
    font-size: 15px;
    font-weight: 600;
    color: #1a5276;
    white-space: nowrap;
  }
  .gravity-section input {
    width: 110px;
    padding: 8px 12px;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    border: 2px solid #85c1e9;
    border-radius: 8px;
    outline: none;
    color: #1a5276;
    background: #fff;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .gravity-section input::placeholder {
    color: #ccc;
    font-weight: 400;
    font-size: 14px;
  }
  .gravity-section input:focus {
    border-color: #2980b9;
  }

  /* 計算テーブル */
  .calc-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #ddd;
  }
  .calc-table th {
    background: #34495e;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 8px;
    text-align: center;
  }
  .calc-table td {
    padding: 0;
    height: 60px;
    text-align: center;
    vertical-align: middle;
    border-top: 2px solid #ddd;
  }
  .calc-table td:first-child {
    border-right: 2px solid #ddd;
  }

  /* 入力セル */
  .input-cell {
    position: relative;
  }
  .input-cell input {
    width: 100%;
    height: 100%;
    padding: 12px 44px 12px 12px;
    font-size: 20px;
    font-weight: 700;
    border: none;
    outline: none;
    background: transparent;
    text-align: right;
    color: #2c3e50;
    -webkit-appearance: none;
  }
  .input-cell input::placeholder {
    color: #ccc;
    font-weight: 400;
    font-size: 14px;
  }
  .input-cell .unit, .result-cell .unit {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    font-weight: 700;
    pointer-events: none;
    user-select: none;
  }
  .row-top .unit, .row-top .result-value { color: #c58a1a; }
  .row-bottom .unit, .row-bottom .result-value { color: #27ae60; }

  /* 結果セル */
  .result-cell {
    position: relative;
  }

  /* 上段の色（L → kg）*/
  .row-top td { background: #fffef5; }
  /* 下段の色（kg → L）*/
  .row-bottom td { background: #f0faf0; }

  .result-value {
    font-size: 20px;
    font-weight: 700;
    padding-right: 44px;
    min-height: 28px;
    display: inline-block;
    line-height: 28px;
  }
  .result-value:empty::before {
    content: '---';
    color: #ccc;
    font-weight: 400;
  }

  /* 行ラベル */
  .row-labels {
    margin-top: 10px;
    display: flex;
    gap: 8px;
  }
  .row-label {
    flex: 1;
    font-size: 11px;
    color: #999;
    text-align: center;
    padding: 4px 0;
  }

  /* 矢印 */
  .arrow-header {
    font-size: 10px;
    letter-spacing: 0.5px;
  }

  /* フォーカスハイライト */
  .input-cell:focus-within {
    background: #fff9e6 !important;
  }

  /* ペーストボタン */
  .paste-buttons {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }
  .paste-btn {
    padding: 14px 0;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    text-align: center;
    touch-action: manipulation;
    transition: transform 0.08s;
  }
  .paste-btn:active {
    transform: scale(0.97);
  }
  .paste-L {
    background: #fffef5;
    color: #c58a1a;
    border: 2px solid #c58a1a;
  }
  .paste-Kg {
    background: #f0faf0;
    color: #27ae60;
    border: 2px solid #27ae60;
  }
  .paste-clear {
    background: #fdf0f0;
    color: #e74c3c;
    border: 2px solid #e74c3c;
  }

  /* ===== 電卓 ===== */
  .calc-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 16px;
    width: 100%;
    max-width: 480px;
  }
  .calc-display {
    background: #1e2a38;
    color: #fff;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
    text-align: right;
    min-height: 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }
  .calc-expr {
    font-size: 13px;
    color: #8899aa;
    min-height: 18px;
    word-break: break-all;
  }
  .calc-result {
    font-size: 28px;
    font-weight: 700;
    word-break: break-all;
    line-height: 1.2;
  }
  .calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .calc-btn {
    padding: 14px 0;
    font-size: 20px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.1s, transform 0.08s;
    touch-action: manipulation;
  }
  .calc-btn:active {
    transform: scale(0.95);
  }
  .calc-btn.num {
    background: #f4f6f8;
    color: #2c3e50;
  }
  .calc-btn.num:active {
    background: #e0e4e8;
  }
  .calc-btn.op {
    background: #3498db;
    color: #fff;
  }
  .calc-btn.op:active {
    background: #2180b9;
  }
  .calc-btn.eq {
    background: #e67e22;
    color: #fff;
  }
  .calc-btn.eq:active {
    background: #c96b15;
  }
  .calc-btn.fn {
    background: #ecf0f1;
    color: #e74c3c;
    font-size: 16px;
  }
  .calc-btn.fn:active {
    background: #dce0e1;
  }
  .calc-btn.wide {
    grid-column: span 2;
  }

  /* スマホ向け微調整 */
  @media (max-width: 380px) {
    .card { padding: 20px 14px 18px; }
    h1 { font-size: 17px; }
    .input-cell input, .result-value { font-size: 18px; }
    .calc-btn { padding: 12px 0; font-size: 18px; }
    .calc-result { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="card">
  <h1>ガソリン 重量・容量 計算</h1>

  <!-- 比重入力 -->
  <div class="gravity-section">
    <label for="gravity">比重:</label>
    <input type="number" id="gravity" step="0.001" min="0" placeholder="比重入力" inputmode="decimal">
  </div>

  <!-- 計算テーブル -->
  <table class="calc-table">
    <thead>
      <tr>
        <th style="width:50%;">入力</th>
        <th style="width:50%;">計算結果 <span class="arrow-header">（自動）</span></th>
      </tr>
    </thead>
    <tbody>
      <!-- 上段: L → kg -->
      <tr class="row-top">
        <td class="input-cell">
          <input type="number" id="inputL" step="any" min="0" placeholder="数量を入力" inputmode="decimal">
          <span class="unit">L</span>
        </td>
        <td class="result-cell">
          <span class="result-value" id="resultKg"></span>
          <span class="unit">kg</span>
        </td>
      </tr>
      <!-- 下段: kg → L -->
      <tr class="row-bottom">
        <td class="input-cell">
          <input type="number" id="inputKg" step="any" min="0" placeholder="数量を入力" inputmode="decimal">
          <span class="unit">kg</span>
        </td>
        <td class="result-cell">
          <span class="result-value" id="resultL"></span>
          <span class="unit">L</span>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="row-labels">
    <div class="row-label">L × 比重 → kg</div>
    <div class="row-label">kg ÷ 比重 → L</div>
  </div>

</div>

<!-- 電卓 -->
<div class="calc-card">
  <div class="calc-display">
    <div class="calc-expr" id="calcExpr"></div>
    <div class="calc-result" id="calcResult">0</div>
  </div>
  <div class="calc-grid">
    <button class="calc-btn fn" data-act="clear">AC</button>
    <button class="calc-btn fn" data-act="backspace">&#9003;</button>
    <button class="calc-btn fn" data-act="percent">%</button>
    <button class="calc-btn op" data-act="op" data-op="÷">÷</button>

    <button class="calc-btn num" data-act="num" data-val="7">7</button>
    <button class="calc-btn num" data-act="num" data-val="8">8</button>
    <button class="calc-btn num" data-act="num" data-val="9">9</button>
    <button class="calc-btn op" data-act="op" data-op="×">×</button>

    <button class="calc-btn num" data-act="num" data-val="4">4</button>
    <button class="calc-btn num" data-act="num" data-val="5">5</button>
    <button class="calc-btn num" data-act="num" data-val="6">6</button>
    <button class="calc-btn op" data-act="op" data-op="-">-</button>

    <button class="calc-btn num" data-act="num" data-val="1">1</button>
    <button class="calc-btn num" data-act="num" data-val="2">2</button>
    <button class="calc-btn num" data-act="num" data-val="3">3</button>
    <button class="calc-btn op" data-act="op" data-op="+">+</button>

    <button class="calc-btn num wide" data-act="num" data-val="0">0</button>
    <button class="calc-btn num" data-act="dot">.</button>
    <button class="calc-btn eq" data-act="equals">=</button>
  </div>
  <div class="paste-buttons">
    <button class="paste-btn paste-L" id="pasteL">L にペースト</button>
    <button class="paste-btn paste-Kg" id="pasteKg">Kg にペースト</button>
    <button class="paste-btn paste-clear" id="clearInputs">入力をクリア</button>
  </div>
</div>

<script>
  // --- PWA: Service Worker 登録 ---
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  const gravityInput = document.getElementById('gravity');
  const inputL       = document.getElementById('inputL');
  const inputKg      = document.getElementById('inputKg');
  const resultKg     = document.getElementById('resultKg');
  const resultL      = document.getElementById('resultL');

  // --- 比重を localStorage から復元 ---
  const savedGravity = localStorage.getItem('gasoline_gravity');
  if (savedGravity !== null) {
    gravityInput.value = savedGravity;
  }

  // --- 計算関数 ---
  function calc() {
    const g = parseFloat(gravityInput.value);

    // L → kg
    const lVal = parseFloat(inputL.value);
    if (!isNaN(g) && g > 0 && !isNaN(lVal)) {
      resultKg.textContent = (lVal * g).toFixed(3);
    } else {
      resultKg.textContent = '';
    }

    // kg → L
    const kgVal = parseFloat(inputKg.value);
    if (!isNaN(g) && g > 0 && !isNaN(kgVal)) {
      resultL.textContent = (kgVal / g).toFixed(3);
    } else {
      resultL.textContent = '';
    }
  }

  // --- イベント ---
  gravityInput.addEventListener('input', () => {
    localStorage.setItem('gasoline_gravity', gravityInput.value);
    calc();
  });
  inputL.addEventListener('input', calc);
  inputKg.addEventListener('input', calc);

  // 初期計算
  calc();

  // ===== ペーストボタン =====
  document.getElementById('pasteL').addEventListener('click', () => {
    const val = calcResult.textContent;
    if (val && val !== 'Error') {
      inputL.value = val;
      calc();
    }
  });
  document.getElementById('pasteKg').addEventListener('click', () => {
    const val = calcResult.textContent;
    if (val && val !== 'Error') {
      inputKg.value = val;
      calc();
    }
  });
  document.getElementById('clearInputs').addEventListener('click', () => {
    inputL.value = '';
    inputKg.value = '';
    calc();
  });

  // ===== 電卓 =====
  // 演算子の優先順位（× ÷ を + - より先に計算）に対応した数式方式
  const calcExpr   = document.getElementById('calcExpr');
  const calcResult = document.getElementById('calcResult');
  let cCurrent = '0';     // 入力中の数値
  let cTokens  = [];      // 確定済みトークン列 例: ['2','+','3','×']（末尾は常に演算子）
  let cEntered = false;   // 現在の数値にユーザーが入力したか（初期の'0'と区別）
  let cJustEval = false;  // = を押した直後か

  function cUpdate() {
    calcResult.textContent = cCurrent;
    calcExpr.textContent = cTokens.length ? cTokens.join(' ') : '';
  }

  // トークン列を優先順位どおりに評価する（× ÷ を先に、+ - を後に）
  function cEvalTokens(tokens) {
    if (!tokens.length) return '0';
    const nums = [parseFloat(tokens[0])];
    const ops  = [];
    for (let i = 1; i < tokens.length; i += 2) {
      const op  = tokens[i];
      const num = parseFloat(tokens[i + 1]);
      if (isNaN(num)) continue;
      if (op === '×') {
        nums[nums.length - 1] *= num;
      } else if (op === '÷') {
        if (num === 0) return 'Error';
        nums[nums.length - 1] /= num;
      } else {
        ops.push(op);
        nums.push(num);
      }
    }
    let result = nums[0];
    for (let i = 0; i < ops.length; i++) {
      if (ops[i] === '+') result += nums[i + 1];
      else if (ops[i] === '-') result -= nums[i + 1];
    }
    if (!isFinite(result)) return 'Error';
    return parseFloat(result.toPrecision(12)).toString();
  }

  document.querySelector('.calc-grid').addEventListener('click', (e) => {
    const btn = e.target.closest('.calc-btn');
    if (!btn) return;
    const act = btn.dataset.act;

    switch(act) {
      case 'num': {
        const v = btn.dataset.val;
        if (cJustEval) { cCurrent = v; cTokens = []; cJustEval = false; cEntered = true; }
        else if (!cEntered) { cCurrent = v; cEntered = true; }
        else cCurrent += v;
        break;
      }
      case 'dot':
        if (cJustEval) { cCurrent = '0.'; cTokens = []; cJustEval = false; cEntered = true; }
        else if (!cEntered) { cCurrent = '0.'; cEntered = true; }
        else if (!cCurrent.includes('.')) cCurrent += '.';
        break;
      case 'op': {
        const newOp = btn.dataset.op;
        if (cJustEval) {
          // 直前の計算結果に続けて演算する
          cTokens = [cCurrent, newOp];
          cCurrent = '0'; cEntered = false; cJustEval = false;
        } else if (!cEntered && cTokens.length) {
          // 数値未入力で演算子を押した → 末尾の演算子を差し替え
          cTokens[cTokens.length - 1] = newOp;
        } else {
          cTokens.push(cCurrent, newOp);
          cCurrent = '0'; cEntered = false;
        }
        break;
      }
      case 'equals':
        if (cTokens.length) {
          const allTokens = cTokens.concat(cCurrent);
          const result = cEvalTokens(allTokens);
          calcExpr.textContent = allTokens.join(' ') + ' =';
          calcResult.textContent = result;
          cCurrent = result;
          cTokens = [];
          cEntered = false;
          cJustEval = true;
          return;
        }
        break;
      case 'clear':
        cCurrent = '0'; cTokens = []; cEntered = false; cJustEval = false;
        break;
      case 'backspace':
        if (cJustEval) { cCurrent = '0'; cEntered = false; cJustEval = false; }
        else if (cEntered) {
          cCurrent = cCurrent.slice(0, -1);
          if (cCurrent === '' || cCurrent === '-') { cCurrent = '0'; cEntered = false; }
        } else if (cTokens.length) {
          cTokens.pop();                    // 末尾の演算子を削除
          cCurrent = cTokens.pop() || '0';  // 直前の数値を編集対象に戻す
          cEntered = true;
        }
        break;
      case 'percent':
        cCurrent = (parseFloat(cCurrent) / 100).toString();
        cEntered = true;
        break;
    }
    cUpdate();
  });
</script>

</body>
</html>
