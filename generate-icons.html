<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Icon Generator</title></head>
<body>
<p>右クリック → 「名前を付けて画像を保存」で保存してください:</p>
<h3>icon-192.png</h3>
<canvas id="c192" width="192" height="192"></canvas>
<h3>icon-512.png</h3>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');
  // 背景
  ctx.fillStyle = '#34495e';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.18);
  ctx.fill();
  // テキスト
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${s * 0.38}px sans-serif`;
  ctx.fillText('⛽', s/2, s * 0.35);
  ctx.font = `bold ${s * 0.13}px sans-serif`;
  ctx.fillStyle = '#f39c12';
  ctx.fillText('L ⇄ kg', s/2, s * 0.72);
}
drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));
</script>
</body></html>
